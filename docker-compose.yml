version: '3.8'

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: coffee
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "0342"
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  app:
    build: .
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://postgres:0342@db:5432/coffee
    ports:
      - "8501:8501"

volumes:
  pgdata: